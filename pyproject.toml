[project]
name = "seachange"
version = "0.1.0"
description = "Generational evolutionary algorithm engine with a SQLite-backed population, extracted from ARIEL."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "jmdm", email = "jacopo.michele.dimatteo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.10.1",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.43",
    "sqlmodel>=0.0.25",
]

[project.urls]
Repository = "https://github.com/Jacopo-DM/seachange"
Issues = "https://github.com/Jacopo-DM/seachange/issues"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "ipykernel>=7.4.0",
    "mypy>=2.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pillow>=13.0.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.2.0",
    "sphinx-autobuild>=2025.8.25",
]
