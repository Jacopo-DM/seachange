[pytest]
testpaths = tests
pythonpath = src
addopts =
    --strict-markers
    --strict-config
    -ra
    --cov=src
    --cov=tests
    --cov-branch
    --cov-report=term-missing
    --cov-fail-under=100
xfail_strict = true
# A SQLite connection left for the garbage collector fails the suite; pytest
# reports a leak found during collection as an unraisable exception
filterwarnings =
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
markers =
    integration: needs network or a real service; excluded by default
