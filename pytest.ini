[pytest]
testpaths = tests
pythonpath = src
addopts =
    --strict-markers
    --strict-config
    -ra
    --cov=src
    --cov=tests
    --cov-branch
    --cov-report=term-missing
    --cov-fail-under=100
xfail_strict = true
markers =
    integration: needs network or a real service; excluded by default
